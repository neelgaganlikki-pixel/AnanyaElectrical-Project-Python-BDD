[pytest]
testpaths = tests step_definitions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Smoke validation test suite
    functional: Functional features and user workflows
    positive: Valid input and business path verifications
    negative: Validation and boundary rejection verifications
    responsive: Cross-device viewport compatibility
    crossbrowser: Multi-engine browser verification
    integration: WhatsApp, phone, email and third party integrations
    security: HTTPS, sanitization and link security
    performance: Navigation Timing and asset health
    seo: Meta tags, headings, Open Graph and Schema.org structured data
    accessibility: WCAG and ARIA compliance
    healing: Self-healing engine recovery and safety tests
    regression: Full regression test suite
    production_safe: Safe read-only tests approved for production
    bdd: Behavior Driven Development feature scenario tests

addopts = -v --tb=short
